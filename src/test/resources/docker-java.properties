# Read by docker-java (which Testcontainers uses) from the test classpath.
#
# Without this, docker-java negotiates Docker API 1.32 and Docker Engine 25+ rejects the very
# first /info call with HTTP 400, surfacing as the misleading "Could not find a valid Docker
# environment". 1.41 ships with Docker Engine 20.10 (2020) and is above the 1.40 floor that
# current engines enforce, so it is compatible in both directions.
api.version=1.41
